<!doctype html>
<html lang="fa" dir="rtl">
<head>

  <meta name="theme-color" content="#090d13">
  <title>NOVENTRA Kitchen | کتابخانه آشپزی</title>
  <style>
    :root{color-scheme:dark;--bg:#090d13;--panel:#111923;--gold:#c9a66b;--silver:#dce3ec;--muted:#aab5c3}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1c2938 0,transparent 48%),var(--bg);color:var(--silver);font-family:Tahoma,Arial,sans-serif;padding:28px 18px}
    main{width:min(820px,100%);margin:5vh auto;border:1px solid #b997623d;background:linear-gradient(145deg,#151f2b,#0d131c);padding:clamp(24px,5vw,52px)}
    header{text-align:center;margin-bottom:34px}
    .brand{letter-spacing:5px;color:var(--gold);font:600 14px Georgia,serif}
    h1{font-size:clamp(26px,5vw,38px);margin:18px 0 10px}
    p{color:var(--muted);line-height:2}
    .chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
    .chapter{padding:24px;border:1px solid #b9976255;background:#0b1119}
    .chapter small{color:var(--gold);letter-spacing:2px}
    .chapter h2{font-size:20px;margin:12px 0}
    .chapter a{display:inline-block;margin-top:12px;padding:12px 18px;background:var(--gold);color:#111;text-decoration:none;font-weight:bold}
    .back{display:block;text-align:center;margin-top:30px;color:var(--muted);text-decoration:none}
  </style>
</head>
<body>
